<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial scale=1">
        <title>Study progress dashboard.</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
        <style>

            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f4f7ff;
            }

            .jumbotron {
                background-color: #e8edff;
                border-left: 6px solid #FF5A43;
            }

            .jumbotron h1 {
                color: #FF5A43;
            }

            .section-title {
                color: #FF5A43;
                margin-top: 30px;
                margin-bottom: 15px;
            }

            p {
                font-weight: bold;
                margin-bottom: 5px;
            }
        </style>
    </head>

    <Body>

        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>Study progress dashboard</h1>
                <P class="lead">Track your subjects, completed lessons, and learning progress in one place!</P>

                <button class="btn btn primary">Math</button>
                <button class="btn btn success">Science</button>
                <button class="btn btn info">English</button>
                <button class="btn btn danger">Coding</button>
            </div>
        </div>

        <div class="container">

            <h2 class="section-title">Lessons completed <span class="badge badge danger">24</span></h2>

            <p>Math <span class="badge badge primary">8 lessons</span>
            <p>Science <span class="badge badge success">6 lessons</span>
            <p>English <span class="badge badge info">5 lessons</span>
            <p>Coding <span class="badge badge danger">5 lessons</span>

            <h2 class="section-title">Subject progress</h2>

            <p>Math</p>
            <div class="progress mb-3">
                <div class="progress bar bg-primary" style="width: 80%;">80%</div>
            </div>

            <p>Science</p>
            <div class="progress mb-3">
                <div class="progress bar bg-success" style="width: 65%;">65%</div>
            </div>

            <p>English</p>
            <div class="progress mb-3">
                <div class="progress bar bg-info" style="width: 55%;">55%</div>
            </div>

            <div class="progress mb-3">
                <div class="progress bar bg-danger" style="width: 70%;">70%</div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"></script>
    </Body>
</html>
